# TRACE-X CI — backend tests (SQLite default + live PostgreSQL integration),
# frontend typecheck/build, and Alembic drift check against PostgreSQL 18.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -m "not pg"

  postgres:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tracex
          POSTGRES_PASSWORD: tracex-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TRACEX_TEST_PG_URL: postgresql+psycopg://tracex:tracex-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Migrations, drift check (alembic check), ingest/analysis/timeline,
      # timestamptz round-trip, owner filtering — all against live PG.
      - run: pytest -q -m pg

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      # `npm run build` runs tsc --noEmit first, so typecheck failures fail the job.
      - run: npm run build
